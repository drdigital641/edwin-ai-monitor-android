<div class="reel reel-mp4" data-part="reel" data-embed="{{embed}}" data-fb="{{url}}" data-title="{{label}} {{n}}">
  <video controls playsinline preload="none" poster="{{poster}}" width="360" height="640" title="{{label}} {{n}}"><source src="{{mp4}}" type="video/mp4"></video>
  <button class="reel-cover" type="button" aria-label="{{play}} {{n}}"><img class="reel-poster" src="{{poster}}" width="360" height="640" alt="{{label}} {{n}}" loading="lazy" decoding="async" onerror="this.remove()"><span class="reel-play" aria-hidden="true"></span><span class="reel-lbl"><span class="mono">REEL {{n}}</span>{{label}}</span></button>
</div>
