<a class="reel" href="{{url}}" target="_blank" rel="noopener" data-embed="{{embed}}" data-title="{{label}} {{n}}" aria-label="{{play}} {{n}}" data-part="reel">
  <span class="reel-trace" aria-hidden="true"></span>
  <span class="reel-play" aria-hidden="true"></span>
  <span class="reel-lbl"><span class="mono">REEL {{n}}</span>{{label}}</span>
</a>
