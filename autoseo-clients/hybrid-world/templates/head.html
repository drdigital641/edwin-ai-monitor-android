<!doctype html>
<html lang="{{lang}}" class="hw-nojs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
{{robots}}  <link rel="canonical" href="{{canonical}}">
{{hreflang}}  <link rel="icon" href="{{base}}favicon.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{base}}apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{brand_name}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:alt" content="{{og_alt}}">
  <meta property="og:locale" content="{{og_locale}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f4f7fb">
  <script>document.documentElement.className = "hw-js";</script>
  <link rel="preload" href="{{base}}fonts/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
{{preload}}  <link rel="stylesheet" href="{{base}}assets/site.css?v={{asset_v}}">
  <script src="{{base}}assets/site.js?v={{asset_v}}" defer></script>
{{schema}}
</head>
