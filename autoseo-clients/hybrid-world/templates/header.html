<body class="{{body_class}}">
<a class="hw-skip" href="#main">{{skip}}</a>
<header class="hw-top" data-part="header">
  <div class="hw-shell hw-top-in">
    <a class="hw-brand" href="{{home}}" aria-label="{{brand}}">
      <img src="{{base}}img/logo-96.webp" width="40" height="40" alt="">
      <span class="hw-brand-txt"><span class="hw-full">{{brand}}</span><span class="hw-abbr">{{short}}</span></span>
    </a>
    <nav class="hw-links" id="hw-links" aria-label="{{nav_label}}">
      <ul>
{{nav_items}}
      </ul>
    </nav>
    <p class="hw-lang" aria-label="{{lang_label}}">{{switcher}}</p>
    {{wa}}
    <button class="hw-menu" id="hw-menu" type="button" aria-expanded="false" aria-controls="hw-links">{{menu}}</button>
  </div>
</header>
