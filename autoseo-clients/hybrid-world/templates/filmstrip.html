<div class="hw-film" data-part="carousel" data-film aria-roledescription="carousel" aria-label="{{label}}">
  <div class="hw-film-rail" tabindex="0">{{items}}</div>
  <div class="hw-film-ctrl">
    <button class="hw-round hw-film-prev" type="button" aria-label="{{prev}}"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="hw-film-dots">{{dots}}</div>
    <button class="hw-round hw-film-next" type="button" aria-label="{{next}}"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>
