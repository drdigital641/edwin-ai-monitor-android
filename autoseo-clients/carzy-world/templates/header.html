<body class="{{body_class}}">
  <a class="skip-link" href="#main">{{skip}}</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="{{home_url}}" aria-label="{{home_aria}}"><img src="{{base}}img/carzy-world-logo-header.webp" width="150" height="50" alt="{{logo_alt}}"></a>
      <nav class="nav" id="nav" aria-label="{{nav_aria}}">
{{nav_links}}
      </nav>
      <p class="lang-switch" aria-label="{{lang_aria}}">{{lang_links}}</p>
      <a class="btn btn-wa btn-small header-wa" href="{{wa_general}}" target="_blank" rel="noopener" data-cta="whatsapp_header">{{wa_icon}}<span>{{whatsapp_us}}</span></a>
      <button class="menu-btn" id="menu-btn" type="button" aria-label="{{menu}}" aria-expanded="false" aria-controls="nav"><span aria-hidden="true">☰</span></button>
    </div>
  </header>
  <main id="main">
