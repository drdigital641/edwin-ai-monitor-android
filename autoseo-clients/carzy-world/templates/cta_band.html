    <section class="cta-band">
      <div class="wrap">
        <h2>{{heading}}</h2>
        <p>{{text}}</p>
        <div class="cta-row center">
          <a class="btn btn-wa" href="{{wa}}" target="_blank" rel="noopener" data-cta="whatsapp_{{cta_id}}_bottom">{{wa_icon}}<span>{{whatsapp_now}}</span></a>
          <a class="btn btn-light" href="tel:{{phone_e164}}" data-cta="call_{{cta_id}}_bottom">{{call_label}}</a>
        </div>
        <p class="offer"><b>{{discount_badge}}</b> · <a href="{{wa_discount}}" target="_blank" rel="noopener" data-cta="whatsapp_{{cta_id}}_discount">{{discount_terms}}</a></p>
      </div>
    </section>
