name: Fetch Klar Details client media

# Downloads the client's own photos from their current WordPress site into the repo
# so the new site no longer hotlinks them (the old host goes away at go-live).

on:
  workflow_dispatch:
  push:
    branches: [ "claude/project-thread-mh5ubf" ]
    paths: [ ".github/workflows/fetch-klar-media.yml" ]

jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/project-thread-mh5ubf

      - name: Diagnose the old host
        run: |
          echo "A records:"; python3 -c "import socket;print(sorted({a[4][0] for a in socket.getaddrinfo('klardetails.com.sg',443,socket.AF_INET)}))" || true
          echo "certificate served for the bare host:"
          openssl s_client -connect klardetails.com.sg:443 -servername klardetails.com.sg </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName || true
          echo "http headers:"; curl -sI -m 15 http://klardetails.com.sg/ | head -12 || true
          echo "https headers (unverified, headers only):"; curl -sI -m 15 --insecure https://klardetails.com.sg/ | head -12 || true

      - name: Resolver check
        run: |
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          for r in 8.8.8.8 1.1.1.1 9.9.9.9; do echo "A via $r: $(dig +short @$r klardetails.com.sg A | tr '\n' ' ') www: $(dig +short @$r www.klardetails.com.sg | tr '\n' ' ')"; done
          echo "NS: $(dig +short @8.8.8.8 klardetails.com.sg NS | tr '\n' ' ')"
          for ip in $(dig +short @8.8.8.8 klardetails.com.sg A) $(dig +short @1.1.1.1 www.klardetails.com.sg A | grep -E '^[0-9.]+$'); do
            echo "== $ip"; curl -s -m 15 --resolve klardetails.com.sg:80:$ip http://klardetails.com.sg/ | grep -o '<title>[^<]*' | head -1 || true
          done

      - name: Download
        run: |
          set -e
          D=pageone-site/clients/klar-details/src/assets/client
          mkdir -p "$D"
          while read -r u; do
            [ -z "$u" ] && continue
            f="$D/$(basename "$u")"
            # their certificate does not cover the bare host (curl 60), so try the www host, then plain http
            w="${u/https:\/\/klardetails.com.sg/https:\/\/www.klardetails.com.sg}"
            h="${u/https:/http:}"
            # last resort: the public wsrv.nl image proxy fetches it server-side (q=92, no resize)
            x="https://wsrv.nl/?url=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$u")&q=92&n=-1"
            # the old WordPress host is already gone (domain now answers 302 -> /404.html with a *.justhost.com cert),
            # so the Wayback Machine's saved copy (id_ = original bytes) is the real source now
            a="https://web.archive.org/web/2026id_/$u"
            b="https://web.archive.org/web/2id_/$u"
            for src in "$a" "$b" "$w" "$h" "$u" "$x"; do
              if curl -fsSL --retry 2 -A "Mozilla/5.0 (PageOne media copy)" -o "$f" "$src"; then echo "ok $f $(stat -c%s "$f") from $src"; break; fi
              echo "miss $src"
            done
            [ -s "$f" ] || { rm -f "$f"; echo "FAIL $u"; }
          done < pageone-site/clients/klar-details/src/client-media-urls.txt
          ls -la "$D"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pageone-site/clients/klar-details/src/assets/client
          git diff --cached --quiet && echo "nothing new" || git commit -m "Klar Details: copy client photos into the repo for go-live"
          git push origin HEAD:claude/project-thread-mh5ubf
