name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify v2.2 timestamp safety contract
        run: |
          grep -q 'versionName = "2.2.0"' app/build.gradle.kts
          grep -q 'reader_version", "2.2-v2-core-exact-bubble"' app/src/main/java/sg/edwingarage/readonlybridge/Base44Sender.kt
          grep -q 'timestamp_confidence", "exact_same_bubble"' app/src/main/java/sg/edwingarage/readonlybridge/Base44Sender.kt
          grep -q 'observedAtMs' app/src/main/java/sg/edwingarage/readonlybridge/Base44Sender.kt
          if grep -R -n 'same_visible_right_bubble' app/src/main/java; then
            echo "Legacy ambiguous timestamp trust marker found"
            exit 1
          fi
          if grep -R -n 'reader_version.*1.3-reliability-raw' app/src/main/java; then
            echo "Legacy v1.3 reader marker found"
            exit 1
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Edwin-AI-Monitor-v2.2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
