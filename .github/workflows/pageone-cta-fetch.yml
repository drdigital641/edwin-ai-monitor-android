name: Page One CTA live fetch (GET-only)
on:
  push:
    branches: [ "claude/project-thread-0igmer" ]
    paths: [ "pageone-cta/pages.txt", "pageone-cta/fetch.py", ".github/workflows/pageone-cta-fetch.yml" ]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live pages
        run: python3 pageone-cta/fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pageone-cta && git commit -m "Page One CTA: live fetch" && git push
