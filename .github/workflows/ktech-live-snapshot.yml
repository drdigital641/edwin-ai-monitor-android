name: K Tech live snapshot (read-only)
# 15 Nov 2026, K Tech contact details update: GET-only HTTP copy of ktech.my so edits can be checked against live bytes.
on:
  push:
    branches: [ "claude/project-thread-t8rwf8" ]
    paths: [ "move-3-sites/run-ktech.txt" ]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 move-3-sites/mirror.py ktech
      - run: |
          git config user.name "hold-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add autoseo-clients/ktech move-3-sites/live
          git commit -q -m "K Tech live HTTP snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin claude/project-thread-t8rwf8 && git push -q origin HEAD:claude/project-thread-t8rwf8 && break; sleep 5; done
