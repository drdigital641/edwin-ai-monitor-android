name: ContiExpert research fetch
on:
  push:
    branches: [ "claude/project-thread-h68h7z" ]
    paths: [ ".github/ce/**" ]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-h68h7z
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install pillow yt-dlp
      - run: python3 .github/ce/fetch2.py
      - name: Commit
        run: |
          git config user.name "claude-research-fetch"
          git config user.email "noreply@anthropic.com"
          git add pageone-site
          git diff --cached --quiet || git commit -m "ContiExpert real-photo fetch (video frames, Google listing photos)"
          git pull --rebase origin claude/project-thread-h68h7z
          git push origin HEAD:claude/project-thread-h68h7z
