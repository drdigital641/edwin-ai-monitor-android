name: Fetch and compress images

on:
  push:
    branches: [ "claude/project-thread-zbfrt7" ]
    paths: [ ".github/fetch/jobs/*.txt" ]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-zbfrt7
      - name: Install Pillow
        run: pip install pillow
      - name: Fetch, resize, convert (job file line 1 = out_dir max_kb max_width, then URLs)
        run: |
          for j in .github/fetch/jobs/*.txt; do
            read -r OUT KB W < "$j"
            tail -n +2 "$j" > /tmp/urls.txt
            python3 .github/fetch/fetch_images.py /tmp/urls.txt "$OUT" "$KB" "$W"
          done
      - name: Commit
        run: |
          git config user.name "claude-image-fetch"
          git config user.email "noreply@anthropic.com"
          git add pageone-site
          git diff --cached --quiet || git commit -m "Compressed WebP images (image fetch workflow)"
          git pull --rebase origin claude/project-thread-zbfrt7
          git push origin HEAD:claude/project-thread-zbfrt7
