name: ContiExpert live snapshot
on:
  push:
    branches: [ "claude/project-thread-8wm44f" ]
    paths: [ ".github/ce-snap/paths.txt", ".github/workflows/ce-snapshot.yml" ]
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live files
        run: |
          mkdir -p .github/ce-snap/live
          for p in $(cat .github/ce-snap/paths.txt); do
            f=$(echo "$p" | tr '/' '_'); curl -sS -A "Mozilla/5.0 Chrome/130" -o ".github/ce-snap/live/${f:-root}" "https://contiexpert.sg/$p"; done
          ls -la .github/ce-snap/live
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ce-snap/live && git commit -m "ContiExpert live snapshot" && git push
