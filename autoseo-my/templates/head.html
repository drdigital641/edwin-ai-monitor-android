<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.add("js");</script>
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
{{robots}}{{canonical}}  <link rel="icon" href="{{base}}favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="{{base}}site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{brand_name}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
{{og_url}}  <meta property="og:locale" content="{{og_locale}}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="theme-color" content="#060b18">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="{{base}}assets/site.css?v={{asset_v}}">
  <script src="{{base}}assets/site.js?v={{asset_v}}" defer></script>
{{schema}}
</head>
