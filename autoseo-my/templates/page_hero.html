    <section class="page-hero">
      <span class="glow glow-1" aria-hidden="true"></span>
      <span class="glow glow-2" aria-hidden="true"></span>
      <div class="wrap">
        <p class="crumbs">{{crumbs}}</p>
        <p class="eyebrow"><span class="live" aria-hidden="true"></span>{{eyebrow}}</p>
        <h1>{{h1}}</h1>
        <p class="lead">{{lead}}</p>
        <div class="cta-row">
          <a class="btn" href="{{wa_primary}}" target="_blank" rel="noopener" data-cta="whatsapp_{{cta_id}}_top">{{btn_primary}}</a>
          <a class="btn btn-ghost" href="{{wa_secondary}}" target="_blank" rel="noopener" data-cta="whatsapp_{{cta_id}}_specialist">{{btn_secondary}}</a>
        </div>
      </div>
    </section>
