<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoSEO Sales</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#060b18">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/site.css?v=30aeba1ce8">
  <style>
    :root { --money: #15803d; --folder: #ff8a3d; }
    html, body { overflow-x: clip; }
    html, body { background: #f6f7fb; } main { background: none; }
    .bar { position: sticky; top: 0; z-index: 10; background: var(--night); color: #fff; }
    .bar-in { max-width: 720px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    .bar .logo-mark { flex: 0 0 auto; }
    .bar h1 { flex: 1 1 auto; margin: 0; color: #fff; font-size: 1.25rem; letter-spacing: -.01em; }
    .edit { min-height: 44px; min-width: 76px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; font: 700 .95rem "Plus Jakarta Sans", sans-serif; cursor: pointer; touch-action: manipulation; }
    .edit.on { background: var(--money); border-color: var(--money); }
    .sline { max-width: 720px; margin: 0 auto; padding: 0 16px 12px; color: #c9d2e3; font-size: .9rem; line-height: 1.4; }
    .sline b { color: #4ade80; font-family: var(--display); font-variant-numeric: tabular-nums; }
    .sline b.w { color: #fff; }
    main { max-width: 720px; margin: 0 auto; padding: 14px 12px 40px; }
    .pin { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .pin label { display: block; font-weight: 700; margin-bottom: 6px; }
    .pin-row { display: flex; gap: 8px; }
    input.t { flex: 1 1 auto; min-width: 0; font: 16px "Plus Jakarta Sans", sans-serif; padding: 10px 12px; min-height: 44px; border: 1px solid #c7cfdc; border-radius: 10px; caret-color: var(--red); }
    .b { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 700 .92rem "Plus Jakarta Sans", sans-serif; cursor: pointer; touch-action: manipulation; white-space: nowrap; }
    .b.go { background: var(--money); border-color: var(--money); color: #fff; }
    .b.del { background: #c8102e; border-color: #c8102e; color: #fff; }
    .b:disabled { opacity: .5; }
    .msg { margin: 8px 0 0; font-size: .88rem; color: #c8102e; min-height: 1.2em; }
    .note { color: var(--muted); font-size: .88rem; margin: 10px 4px; }

    .list { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .list ul { list-style: none; margin: 0; padding: 0; }
    .row { display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 0 8px 0 calc(6px + var(--d, 0) * 22px); border-top: 1px solid var(--line); }
    .list > ul > li:first-child > .row { border-top: 0; }
    .tog { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 56px; background: none; border: 0; padding: 0 4px; text-align: left; font: inherit; color: var(--ink); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: rgba(255,138,61,.15); }
    .chev { flex: 0 0 18px; width: 18px; height: 18px; color: var(--muted); transition: transform .15s ease-out; }
    .chev.open { transform: rotate(90deg); }
    .chev.none { visibility: hidden; }
    .fold { flex: 0 0 24px; width: 24px; height: 24px; color: var(--folder); }
    .row.top .fold { color: #ff3d57; }
    .name { flex: 0 1 auto; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row.top .name { font-family: var(--display); font-size: 1.08rem; }
    .tag { flex: 0 0 auto; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #e0f2fe; color: #075985; }
    .tag.ref { background: #ffedd5; color: #9a3412; }
    .cnt { flex: 0 0 auto; margin-left: auto; min-width: 26px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--money); color: #fff; font: 800 .8rem/24px "Plus Jakarta Sans", sans-serif; text-align: center; }
    .rm { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 10px; border: 1px solid #f3c2ca; background: #fff5f6; color: #c8102e; font: 800 1.3rem/1 "Plus Jakarta Sans", sans-serif; cursor: pointer; touch-action: manipulation; }
    .sub { padding: 8px 8px 10px calc(6px + var(--d, 0) * 22px); border-top: 1px dashed var(--line); background: #fbfcfe; }
    .sub p { margin: 0 0 8px; font-size: .92rem; }
    .sub .acts { display: flex; gap: 8px; flex-wrap: wrap; }
    .addb { color: var(--money); border-style: dashed; }
    .empty { padding: 14px 16px; color: var(--muted); font-size: .92rem; border-top: 1px solid var(--line); }
    @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-in">
      <span class="logo-mark" aria-hidden="true">A</span>
      <h1>AutoSEO Sales</h1>
      <button class="edit" id="edit" type="button">Edit</button>
    </div>
    <p class="sline" id="split"></p>
  </header>
  <main>
    <div class="pin" id="pinbox" hidden>
      <label for="pin">Edit PIN</label>
      <div class="pin-row">
        <input class="t" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="40">
        <button class="b go" id="pin-go" type="button">Unlock</button>
        <button class="b" id="pin-x" type="button">Cancel</button>
      </div>
      <p class="msg" id="pin-msg" role="status"></p>
    </div>
    <div class="list"><ul id="tree"></ul></div>
    <p class="note" id="note"></p>
  </main>
<script>
(function () {
  "use strict";
  // ONE place for the commission numbers. Change here only.
  var SPLIT = { currency: "RM", sale: 300, keep: 200, pool: 100, level1: 60, level2: 40, levels: 2 };
  var API = "https://auto-seo-sales-web-675618e9.base44.app/api/sales-web";
  function rm(n) { return SPLIT.currency + n; }
  function $(id) { return document.getElementById(id); }
  function el(tag, a, kids) {
    var e = document.createElement(tag);
    Object.keys(a || {}).forEach(function (k) {
      if (k === "text") e.textContent = a[k];
      else if (k === "class") e.className = a[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), a[k]);
      else e.setAttribute(k, a[k]);
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  var NS = "http://www.w3.org/2000/svg";
  function icon(kind, cls) {
    var s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", cls); s.setAttribute("aria-hidden", "true");
    var p = document.createElementNS(NS, "path");
    if (kind === "chev") { p.setAttribute("d", "M9 5l7 7-7 7"); p.setAttribute("fill", "none"); p.setAttribute("stroke", "currentColor"); p.setAttribute("stroke-width", "2.5"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round"); }
    else { p.setAttribute("d", "M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"); p.setAttribute("fill", "currentColor"); }
    s.appendChild(p); return s;
  }

  // Split line
  var sp = $("split");
  sp.append("Customer ", el("b", { class: "w", text: rm(SPLIT.sale) }), ": AutoSEO ", el("b", { class: "w", text: rm(SPLIT.keep) }), ", Direct ", el("b", { text: rm(SPLIT.level1) }), ", Referrer ", el("b", { text: rm(SPLIT.level2) }));

  var nodes = [{ id: "centre", name: "AutoSEO.my", role: "centre", parentId: "" }];
  var open = {}, live = false, ui = null; // ui = {kind:"add"|"rm", id}
  var pin = null;
  try { pin = sessionStorage.getItem("autoseo_sales_pin"); } catch (e) {}

  function byId(id) { for (var i = 0; i < nodes.length; i++) if (nodes[i].id === id) return nodes[i]; return null; }
  function centre() { for (var i = 0; i < nodes.length; i++) if (nodes[i].role === "centre") return nodes[i]; return nodes[0]; }
  function kids(id) { return nodes.filter(function (n) { return n.parentId === id; }); }
  function editing() { return !!pin && live; }

  function render() {
    var root = $("tree"); root.textContent = "";
    function item(n, d) {
      var top = n.role === "centre", k = kids(n.id), isOpen = top || !!open[n.id];
      var li = el("li");
      var row = el("div", { class: "row" + (top ? " top" : ""), style: "--d:" + d });
      var tog = el("button", { class: "tog", type: "button", "aria-expanded": String(isOpen) }, [
        icon("chev", "chev" + (isOpen ? " open" : "") + (k.length || (editing() && !top) ? "" : " none")),
        icon("folder", "fold"),
        el("span", { class: "name", text: n.name }),
        top ? null : el("span", { class: "tag" + (k.length ? " ref" : ""), text: k.length ? "Referrer" : "Direct" })
      ]);
      if (top) tog.disabled = false;
      tog.addEventListener("click", function () { if (!top) { open[n.id] = !open[n.id]; if (ui && ui.kind === "add" && ui.id === n.id) ui = null; render(); } });
      row.appendChild(tog);
      if (k.length) row.appendChild(el("span", { class: "cnt", "aria-label": k.length + " referrals", text: String(k.length) }));
      if (editing() && !top) row.appendChild(el("button", { class: "rm", type: "button", "aria-label": "Remove " + n.name, text: "−", onclick: function () { ui = { kind: "rm", id: n.id }; render(); } }));
      li.appendChild(row);
      if (ui && ui.kind === "rm" && ui.id === n.id) li.appendChild(removeBox(n, d));
      if (isOpen) {
        var ul = el("ul");
        k.forEach(function (c) { ul.appendChild(item(c, d + 1)); });
        if (editing()) ul.appendChild(el("li", {}, [addBox(n, d + 1)]));
        if (ul.childNodes.length) li.appendChild(ul);
      }
      return li;
    }
    root.appendChild(item(centre(), 0));
    if (nodes.length === 1 && !editing()) root.appendChild(el("li", { class: "empty", text: "No people yet." }));
  }

  function addBox(parent, d) {
    var box = el("div", { class: "sub", style: "--d:" + d });
    if (!(ui && ui.kind === "add" && ui.id === parent.id)) {
      box.appendChild(el("button", { class: "b addb", type: "button", text: "+ Add", onclick: function () { ui = { kind: "add", id: parent.id }; render(); var i = document.getElementById("add-name"); if (i) i.focus(); } }));
      return box;
    }
    var inp = el("input", { class: "t", id: "add-name", type: "text", maxlength: "60", autocomplete: "off", placeholder: "Name", "aria-label": "Name of new person under " + parent.name });
    var msg = el("p", { class: "msg", role: "status" });
    var save = el("button", { class: "b go", type: "button", text: "Add" });
    function go() {
      var v = inp.value.trim(); if (!v) { msg.textContent = "Type a name."; return; }
      save.disabled = true; msg.textContent = "";
      call({ action: "add", name: v, role: "salesperson", parentId: parent.id }).then(function (r) {
        if (r.ok) { open[parent.id] = true; ui = { kind: "add", id: parent.id }; return load().then(function () { var i = document.getElementById("add-name"); if (i) i.focus(); }); }
        save.disabled = false; msg.textContent = errText(r.error);
      });
    }
    save.addEventListener("click", go);
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    box.appendChild(el("div", { class: "pin-row" }, [inp, save, el("button", { class: "b", type: "button", text: "Cancel", onclick: function () { ui = null; render(); } })]));
    box.appendChild(msg);
    return box;
  }

  function removeBox(n, d) {
    var k = kids(n.id), parent = byId(n.parentId);
    var msg = el("p", { class: "msg", role: "status" });
    var yes = el("button", { class: "b del", type: "button", text: "Remove" });
    yes.addEventListener("click", function () {
      yes.disabled = true;
      call({ action: "remove", id: n.id, children: "lift" }).then(function (r) {
        if (r.ok) { ui = null; return load(); }
        yes.disabled = false; msg.textContent = errText(r.error);
      });
    });
    var text = "Remove " + n.name + "?" + (k.length ? " Their " + k.length + (k.length === 1 ? " referral moves" : " referrals move") + " up to " + (parent ? parent.name : "AutoSEO.my") + "." : "");
    return el("div", { class: "sub", style: "--d:" + (d + 1) }, [el("p", { text: text }), el("div", { class: "acts" }, [yes, el("button", { class: "b", type: "button", text: "Cancel", onclick: function () { ui = null; render(); } })]), msg]);
  }

  function errText(e) {
    return ({ wrong_pin: "Wrong PIN.", locked: "Too many wrong PINs. Try again in 15 minutes.", edit_off: "Editing is off on the server.", name: "Type a name.", parent: "That folder is gone. Reload the page.", full: "List is full (500).", network: "No connection. Try again.", origin: "Editing only works on autoseo.my." })[e] || "Something went wrong. Try again.";
  }
  function call(body) {
    body.pin = pin;
    return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), cache: "no-store" })
      .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
      .catch(function () { return { ok: false, error: "network" }; })
      .then(function (r) { if (r && r.error === "wrong_pin") { setPin(null); } return r; });
  }
  function load() {
    return fetch(API, { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
      if (!d || !d.ok || !d.nodes || !d.nodes.length) throw 0;
      nodes = d.nodes; live = true; $("note").textContent = ""; render();
    }).catch(function () {
      live = false; $("note").textContent = "Live data not connected yet."; render();
    });
  }

  function setPin(v) {
    pin = v;
    try { if (v) sessionStorage.setItem("autoseo_sales_pin", v); else sessionStorage.removeItem("autoseo_sales_pin"); } catch (e) {}
    $("edit").textContent = v ? "Done" : "Edit";
    $("edit").classList.toggle("on", !!v);
    ui = null; render();
  }
  $("edit").addEventListener("click", function () {
    if (pin) { setPin(null); return; }
    $("pinbox").hidden = false; $("pin").focus();
  });
  $("pin-x").addEventListener("click", function () { $("pinbox").hidden = true; $("pin").value = ""; $("pin-msg").textContent = ""; });
  function unlock() {
    var v = $("pin").value.trim(); if (!v) return;
    if (!live) { $("pin-msg").textContent = "Live data not connected yet."; return; }
    pin = v;
    call({ action: "check" }).then(function (r) {
      if (r.ok) { $("pin").value = ""; $("pinbox").hidden = true; $("pin-msg").textContent = ""; setPin(v); }
      else { pin = null; $("pin-msg").textContent = errText(r.error); }
    });
  }
  $("pin-go").addEventListener("click", unlock);
  $("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") unlock(); });

  if (pin) { $("edit").textContent = "Done"; $("edit").classList.add("on"); }
  render();
  load();
})();
</script>
<script src="/p1-cta.js?v=33c3c1b4" defer></script>
</body>
</html>
